name: Release CF CLI
run-name: Release CF CLI ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "cfcli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create in cfcli-v* format
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish CF CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      UPX_VERSION: "5.1.1"
      UPX_SHA256: "1ff660454227861e00772f743f66b900072116b9dc24f6ee28b97cce88a7828a"
    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: cfcli/go.mod
          cache: true

      - name: Test CF CLI
        working-directory: cfcli
        run: go test -count=1 ./...

      - name: Vet CF CLI
        working-directory: cfcli
        run: go vet ./...

      - name: Prepare release directory
        run: mkdir --parents dist

      - name: Build Windows AMD64
        working-directory: cfcli
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOOS: windows
        run: >-
          go build -trimpath -ldflags="-s -w -buildid="
          -o ../dist/cfcli-windows-amd64.exe .

      - name: Build Linux AMD64
        working-directory: cfcli
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOOS: linux
        run: >-
          go build -trimpath -ldflags="-s -w -buildid="
          -o ../dist/cfcli-linux-amd64 .

      - name: Install UPX
        shell: bash
        run: |
          set -euo pipefail
          archive="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          url="https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${archive}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$url"
          echo "$UPX_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --xz --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/upx-${UPX_VERSION}-amd64_linux" >> "$GITHUB_PATH"

      - name: Compress and validate binaries
        shell: bash
        run: |
          set -euo pipefail
          upx -9 dist/cfcli-windows-amd64.exe dist/cfcli-linux-amd64
          upx -t dist/cfcli-windows-amd64.exe dist/cfcli-linux-amd64
          chmod 0755 dist/cfcli-linux-amd64

      - name: Create GitHub release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_TARGET: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^cfcli-v.+$ ]]; then
            echo "Invalid release tag '$RELEASE_TAG': expected cfcli-v* format." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Cannot create release tag '$RELEASE_TAG': the tag already exists." >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              dist/cfcli-windows-amd64.exe \
              dist/cfcli-linux-amd64 \
              --target "$RELEASE_TARGET" \
              --generate-notes \
              --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              dist/cfcli-windows-amd64.exe \
              dist/cfcli-linux-amd64 \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
