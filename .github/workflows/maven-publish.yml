name: Publish package to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

permissions: {}

concurrency:
  group: maven-publish-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Maven packages
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'fx-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Publish package
        run: mvn --batch-mode --no-transfer-progress deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
